<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学生信息管理系统 - 登录</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <h1>学生信息管理系统</h1>
      <p>请选择登录类型并输入账号密码</p>
      
      <div id="alertContainer"></div>
      
      <div class="user-type-selector">
        <button type="button" class="active" data-type="admin">管理员</button>
        <button type="button" data-type="student">学生</button>
      </div>
      
      <form id="loginForm">
        <div class="form-group">
          <label for="username" id="usernameLabel">用户名</label>
          <input type="text" id="username" name="username" required>
        </div>
        
        <div class="form-group">
          <label for="password">密码</label>
          <input type="password" id="password" name="password" required>
        </div>
        
        <button type="submit" class="btn btn-primary btn-block">登录</button>
      </form>
      
      <div style="text-align: center; margin-top: 20px;">
        <p style="color: var(--text-light);">还没有账号？</p>
        <a href="register.html" class="btn btn-secondary btn-block" style="margin-top: 10px;">学生注册</a>
      </div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>

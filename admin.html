<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学生信息管理系统 - 管理员</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="header">
    <div class="header-content">
      <h1>学生信息管理系统</h1>
      <div class="header-actions">
        <button class="btn btn-primary" onclick="openAddModal()">添加学生</button>
        <button class="btn btn-danger" onclick="logout()">退出登录</button>
      </div>
    </div>
  </div>

  <div class="container">
    <div id="alertContainer"></div>
    
    <div class="card">
      <h2>学生信息管理</h2>
      
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="搜索学号、姓名、班级或专业..." onkeyup="handleSearch(event)">
        <button class="btn btn-primary" onclick="searchStudents()">搜索</button>
        <button class="btn btn-secondary" onclick="clearSearch()">清空</button>
      </div>
      
      <div class="table-container">
        <div id="loadingIndicator" class="loading" style="display: none;">
          <div class="spinner"></div>
          <p>加载中...</p>
        </div>
        
        <div id="studentsTableContainer"></div>
      </div>
    </div>
  </div>

  <!-- 添加/编辑学生模态框 -->
  <div id="studentModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">添加学生</h2>
        <button class="close" onclick="closeModal()">&times;</button>
      </div>
      
      <form id="studentForm">
        <input type="hidden" id="studentId" name="id">
        
        <div class="form-group">
          <label for="studentIdInput">学号 *</label>
          <input type="text" id="studentIdInput" name="studentId" required>
        </div>
        
        <div class="form-group">
          <label for="passwordInput">密码 <span id="passwordHint">*</span></label>
          <input type="password" id="passwordInput" name="password">
          <small style="color: var(--text-light);">编辑时留空则不修改密码</small>
        </div>
        
        <div class="form-group">
          <label for="nameInput">姓名 *</label>
          <input type="text" id="nameInput" name="name" required>
        </div>
        
        <div class="form-group">
          <label for="genderInput">性别 *</label>
          <select id="genderInput" name="gender" required>
            <option value="">请选择</option>
            <option value="男">男</option>
            <option value="女">女</option>
          </select>
        </div>
        
        <div class="form-group">
          <label for="ageInput">年龄 *</label>
          <input type="number" id="ageInput" name="age" min="1" max="100" required>
        </div>
        
        <div class="form-group">
          <label for="classNameInput">班级 *</label>
          <input type="text" id="classNameInput" name="className" required>
        </div>
        
        <div class="form-group">
          <label for="majorInput">专业 *</label>
          <input type="text" id="majorInput" name="major" required>
        </div>
        
        <div class="action-buttons">
          <button type="submit" class="btn btn-primary btn-block">保存</button>
          <button type="button" class="btn btn-secondary btn-block" onclick="closeModal()">取消</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
